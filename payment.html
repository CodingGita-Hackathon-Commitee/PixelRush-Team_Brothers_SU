<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckTrail - Payment</title>
    <link rel="stylesheet" href="payment.css">
</head>

<body>

<header>

    <div>
        <h1>💳 Payment</h1>
        <p>Choose your payment method.</p>
    </div>

    <a href="checkout.html">← Back</a>

</header>


<main>

    <div class="amount">
        <p>Total Amount</p>
        <h1>₹1,861</h1>
    </div>


    <h2>Select Payment Method</h2>


    <div class="payment-grid">


        <a href="qr.html" class="payment-card">

            <div class="icon">📱</div>

            <h3>UPI / QR Payment</h3>

            <p>Pay using any UPI application.</p>

            <span>Choose →</span>

        </a>


        <a href="../Team-4/tracking.html" class="payment-card">

            <div class="icon">💳</div>

            <h3>Credit / Debit Card</h3>

            <p>Visa, Mastercard, RuPay and more.</p>

            <span>Choose →</span>

        </a>


        <a href="../Team-4/tracking.html" class="payment-card">

            <div class="icon">💵</div>

            <h3>Cash on Pickup</h3>

            <p>Pay when you collect your food.</p>

            <span>Choose →</span>

        </a>


    </div>

</main>

</body>
</html>
