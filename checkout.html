<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckTrail - Checkout</title>
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

<header>
    <h1>Checkout</h1>
    <a href="../Team-2/cart.html">← Back to Cart</a>
</header>


<main>

    <div class="checkout-layout">


        <section>

            <h2>Pickup Details</h2>

            <div class="form-box">

                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Phone Number</label>
                <input type="tel" placeholder="Enter phone number" required>

                <label>Pickup Location</label>
                <input type="text" value="Taco Loco - Main Street">

                <label>Pickup Date</label>
                <input type="date">

                <label>Pickup Time</label>

                <select>
                    <option>ASAP</option>
                    <option>1:20 PM</option>
                    <option>1:30 PM</option>
                    <option>1:45 PM</option>
                    <option>2:00 PM</option>
                    <option>2:30 PM</option>
                    <option>3:00 PM</option>
                    <option>4:00 PM</option>
                </select>

            </div>

        </section>


        <aside class="summary">

            <h2>Order Summary</h2>

            <div>
                <span>Premium Chicken Tacos</span>
                <b>₹599</b>
            </div>

            <div>
                <span>Chef's Premium Pizza</span>
                <b>₹1,099</b>
            </div>

            <hr>

            <div>
                <span>Subtotal</span>
                <b>₹1,698</b>
            </div>

            <div>
                <span>GST</span>
                <b>₹85</b>
            </div>

            <div>
                <span>Service Fee</span>
                <b>₹49</b>
            </div>

            <div>
                <span>Pickup Fee</span>
                <b>₹29</b>
            </div>

            <hr>

            <div class="total">
                <span>Total</span>
                <b>₹1,861</b>
            </div>

            <a href="payment.html">
                Continue to Payment
            </a>

        </aside>

    </div>

</main>

</body>
</html>
